[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "he2st-liver-benchmark"
version = "0.1.0"
description = "Reproducible H&E-to-spatial-expression experiments on a fixed human liver benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "scikit-learn>=1.4",
  "Pillow>=10", "tifffile>=2024.1", "torch>=2.6", "torchvision>=0.21"
]

[project.optional-dependencies]
reports = ["matplotlib>=3.8", "python-pptx>=1.0", "PyMuPDF>=1.24"]
anndata = ["anndata>=0.10"]

[project.scripts]
he2st = "he2st.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
